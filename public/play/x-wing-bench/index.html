<style>
/* Layout: drafting sheet. Model viewport with spec column, elevation, then a grid of construction details. */
:root {
  --paper: #f3f4f1;
  --sheet: #fbfbf9;
  --ink: #1f2a2e;
  --ink-soft: #5b676b;
  --rule: #d7dbd6;
  --birch: #d4b07a;
  --birch-edge: #e6cfa4;
  --leather: #6b3418;
  --rubber: #2b2f31;
  --alu: #a9afb4;
  --nylon: #1a1d1f;
  --accent: #8a4a26;
  --font-display: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15191b; --sheet: #1c2124; --ink: #e6e9e6; --ink-soft: #9aa5a8; --rule: #30383b;
    --nylon: #0b0d0e; --rubber: #3a4044; --accent: #d08a5c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15191b; --sheet: #1c2124; --ink: #e6e9e6; --ink-soft: #9aa5a8; --rule: #30383b;
  --nylon: #0b0d0e; --rubber: #3a4044; --accent: #d08a5c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); font-weight: 500; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .top { grid-template-columns: minmax(0, 1fr); } }
.viewer { position: relative; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; }
#stage { display: block; width: 100%; aspect-ratio: 16 / 10; max-width: 100%; touch-action: none; }
.controls { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.controls button { font: 500 13px var(--font-body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { position: absolute; right: 12px; top: 20px; font: 12px var(--font-mono); color: var(--ink-soft); }
@media (max-width: 760px) { .hint { display: none; } }
.caption { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 13px; color: var(--ink-soft); }
aside { display: grid; gap: 18px; align-content: start; min-width: 0; }
h2 { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 8px; }
dl.spec { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: 14px; }
dl.spec dt { color: var(--ink-soft); }
dl.spec dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.parts { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.parts li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.sw { width: 14px; height: 14px; border-radius: 3px; margin-top: 4px; border: 1px solid var(--rule); }
.parts b { font-weight: 600; }
.finish { display: grid; gap: 12px; }
.swrow { display: grid; gap: 6px; }
.swrow .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.swrow .lbl b { color: var(--ink); font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); padding: 0; cursor: pointer; box-shadow: inset 0 0 0 2px var(--sheet); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.swatches button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatches .sep { width: 1px; background: var(--rule); margin: 2px 2px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 18px 14px; min-width: 0; }
.scroll { overflow-x: auto; }
#elev { display: block; width: 100%; min-width: 660px; height: auto; }
svg .ply { fill: var(--birch); stroke: var(--ink); stroke-width: 1; }
svg .ply2 { fill: var(--birch-edge); stroke: var(--ink); stroke-width: 1; }
svg .rub { fill: var(--rubber); }
svg .lea { fill: var(--leather); }
svg .alu { fill: var(--alu); stroke: var(--ink); stroke-width: 0.6; }
svg .nyl { fill: var(--nylon); }
svg .foam { fill: var(--birch-edge); fill-opacity: 0.5; stroke: var(--ink-soft); stroke-width: 0.6; }
svg .rib { fill: var(--birch); stroke: var(--ink); stroke-width: 1; }
svg .dim { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
svg .lead { stroke: var(--ink-soft); stroke-width: 0.8; fill: none; }
svg .arrow { stroke: var(--accent); stroke-width: 1.6; fill: none; }
svg .arrowhead { fill: var(--accent); }
svg .screw { fill: var(--alu); stroke: var(--ink); stroke-width: 0.8; }
svg .ink { fill: var(--ink); }
svg .inkline { stroke: var(--ink); stroke-width: 1; fill: none; }
svg .pscrew { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
svg .void { fill: var(--sheet); stroke: var(--ink); stroke-width: 0.8; stroke-dasharray: 3 2; }
svg text { font: 11px var(--font-mono); fill: var(--ink-soft); }
svg text.lbl { fill: var(--ink); }
svg .floor { stroke: var(--ink); stroke-width: 1; }
svg .band-a { fill: var(--accent); fill-opacity: 0.14; }
svg .band-c { fill: var(--ink-soft); fill-opacity: 0.16; }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.compare figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.compare figcaption { font-size: 14px; }
.compare figcaption b { font-weight: 600; }
.compare svg { display: block; width: 100%; height: auto; }
.compare dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 0; font-size: 13px; }
.compare dt { color: var(--ink-soft); }
.compare dd { margin: 0; font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.details { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
@media (max-width: 420px) { .details { grid-template-columns: minmax(0, 1fr); } }
.detail { display: grid; gap: 10px; align-content: start; }
.detail h3 { font: 600 16px var(--font-display); margin: 0; }
.detail svg { display: block; width: 100%; min-width: 420px; height: auto; }
.detail ol, .detail p { margin: 0; padding-left: 1.2em; font-size: 14px; max-width: 62ch; }
.detail p { padding-left: 0; }
.detail li + li { margin-top: 3px; }
.files { width: 100%; border-collapse: collapse; font-size: 14px; }
.files th { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.files td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.files td.n { font-family: var(--font-mono); white-space: nowrap; }
.files a { color: var(--accent); font-weight: 600; text-decoration: none; }
.files a:hover { text-decoration: underline; }
.files .note { color: var(--ink-soft); font-size: 13px; }
.printgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .printgrid { grid-template-columns: minmax(0, 1fr); } }
.pview { position: relative; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
#pstage { display: block; width: 100%; aspect-ratio: 4 / 3; touch-action: none; }
.pcap { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 12px; color: var(--ink-soft); }
.pbtn { font: 600 14px var(--font-body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.pbtn[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.readme { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 12px; font-size: 14px; max-width: 80ch; }
.readme h3 { margin: 0 0 6px; font-size: 15px; } .readme h3 a { font: 500 12px var(--font-mono); color: var(--accent); margin-left: 8px; }
.readme h4 { margin: 12px 0 4px; font-size: 14px; } .readme ul { margin: 0; padding-left: 18px; } .readme li { margin: 3px 0; } .readme p { margin: 0; }
footer { font-size: 13px; color: var(--ink-soft); max-width: 75ch; }
</style>

  <div class="top">
    <div class="viewer">
      <canvas id="stage" aria-label="3D model of the hybrid bench"></canvas>

        <button id="v-assembled" aria-pressed="true">Assembled</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // ================= Geometry (mm) =================
  const T = 20, DEPTH = 400;
  const SEAT_CL = 440, FOOT_CL = 27, ARM_CL = 625;
  const LEG_ANGLE = 70, RAD = LEG_ANGLE * Math.PI / 180, TAN = Math.tan(RAD);
  const R = 70;
  const SEAT_FLAT = 1500;
  const DT = R / Math.tan((Math.PI - RAD) / 2);
  const X1 = SEAT_FLAT / 2 + DT;
  const RETURN = 200;
  const C = (ARM_CL + FOOT_CL) / 2;
  const SHELF_CL = 2 * C - SEAT_CL;
  const X2 = X1 + (SEAT_CL - FOOT_CL) / TAN;
  const XEND = X2 + RETURN;
  const XCROSS = X1 + (SEAT_CL - C) / TAN;
  const CROSS_ANGLE = 180 - 2 * LEG_ANGLE;
  const TH = CROSS_ANGLE * Math.PI / 180;
  const SLOT_W = T / Math.sin(TH) + T / Math.tan(TH) + 1;
  const SLOT_D = DEPTH / 2;
  const SHOE_H = FOOT_CL - T / 2;
  const PAD_H = 24, PAD_FRONT_FREE = 0;
  const PAD_X0 = X2 + 20, PAD_X1 = XEND;
  const RIB_X = 250, RIB_T = 18, HOUSING = 5;
  const SP_W = 460, SP_D = 360, SP_H = 22, SP_REC = 3, SP_R = 45;
  const H0 = T / (2 * Math.cos(RAD));

  const verts = [[-XEND, FOOT_CL], [-X2, FOOT_CL], [-X1, SEAT_CL], [X1, SEAT_CL], [X2, FOOT_CL], [XEND, FOOT_CL]];

  function centreline() {
    const pts = [verts[0]];
    for (let i = 1; i < verts.length - 1; i++) {
      const [ax, ay] = verts[i - 1], [bx, by] = verts[i], [cx, cy] = verts[i + 1];
      let u1 = [ax - bx, ay - by], u2 = [cx - bx, cy - by];
      const l1 = Math.hypot(...u1), l2 = Math.hypot(...u2);
      u1 = [u1[0] / l1, u1[1] / l1]; u2 = [u2[0] / l2, u2[1] / l2];
      const th = Math.acos(u1[0] * u2[0] + u1[1] * u2[1]);
      const d = R / Math.tan(th / 2);
      let bis = [u1[0] + u2[0], u1[1] + u2[1]]; const lb = Math.hypot(...bis); bis = [bis[0] / lb, bis[1] / lb];
      const ctr = [bx + bis[0] * R / Math.sin(th / 2), by + bis[1] * R / Math.sin(th / 2)];
      const t1 = [bx + u1[0] * d, by + u1[1] * d], t2 = [bx + u2[0] * d, by + u2[1] * d];
      const a1 = Math.atan2(t1[1] - ctr[1], t1[0] - ctr[0]);
      let da = Math.atan2(t2[1] - ctr[1], t2[0] - ctr[0]) - a1;
      while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      for (let k = 0; k <= 16; k++) { const a = a1 + da * k / 16; pts.push([ctr[0] + R * Math.cos(a), ctr[1] + R * Math.sin(a)]); }
    }
    pts.push(verts[verts.length - 1]);
    return pts;
  }
  const CL = centreline();
  const CS = [0]; for (let i = 1; i < CL.length; i++) CS.push(CS[i - 1] + Math.hypot(CL[i][0] - CL[i - 1][0], CL[i][1] - CL[i - 1][1]));
  const LEN = CS[CS.length - 1];
  function at(s) {
    let i = 1; while (i < CS.length - 1 && CS[i] < s) i++;
    const f = (s - CS[i - 1]) / (CS[i] - CS[i - 1]);
    return [CL[i - 1][0] + (CL[i][0] - CL[i - 1][0]) * f, CL[i - 1][1] + (CL[i][1] - CL[i - 1][1]) * f];
  }
  let sCross = 0, best = 1e9;
  for (let s = LEN / 2; s < LEN; s += 0.25) { const p = at(s); const d = Math.hypot(p[0] - XCROSS, p[1] - C); if (d < best) { best = d; sCross = s; } }
  const sCrossL = LEN - sCross;

  function outlineRange(sa, sb) {
    const pts = [at(sa)], ss = [sa];
    for (let i = 0; i < CL.length; i++) if (CS[i] > sa + 0.01 && CS[i] < sb - 0.01) { pts.push(CL[i]); ss.push(CS[i]); }
    pts.push(at(sb)); ss.push(sb);
    const n = pts.length, L = [], Rr = [];
    for (let i = 0; i < n; i++) {
      const p = pts[Math.max(0, i - 1)], q = pts[Math.min(n - 1, i + 1)];
      let tx = q[0] - p[0], ty = q[1] - p[1]; const l = Math.hypot(tx, ty); tx /= l; ty /= l;
      L.push({ x: pts[i][0] - ty * T / 2, y: pts[i][1] + tx * T / 2, s: ss[i], v: 1 });
      Rr.push({ x: pts[i][0] + ty * T / 2, y: pts[i][1] - tx * T / 2, s: ss[i], v: 0 });
    }
    return L.concat(Rr.reverse());
  }
  const OUT_FULL = outlineRange(0, LEN);
  const flipY = p => ({ x: p.x, y: 2 * C - p.y });

  const uSeat = [Math.cos(-RAD), Math.sin(-RAD)], nSeat = [-uSeat[1], uSeat[0]];
  const uShelf = [Math.cos(RAD), Math.sin(RAD)], nShelf = [-uShelf[1], uShelf[0]];
  const add2 = (a, b, k) => [a[0] + b[0] * k, a[1] + b[1] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  function slotRect(c, u, n, grow) {
    const w = SLOT_W / 2 + (grow || 0), t = T / 2 + (grow || 0);
    return [add2(add2(c, u, -w), n, -t), add2(add2(c, u, w), n, -t), add2(add2(c, u, w), n, t), add2(add2(c, u, -w), n, t)];
  }
  function clip(poly, n, c, k, keepAbove) {
    const f = p => keepAbove ? dot([p[0] - c[0], p[1] - c[1]], n) - k : -k - dot([p[0] - c[0], p[1] - c[1]], n);
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], fa = f(a), fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) { const t = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
    }
    return out;
  }
  const CX = [XCROSS, C];
  // move a point along direction u until it lies on the nearer face of the other leg (strip |dot(p-c,n)| = T/2)
  function toStrip(P, u, c, n) {
    const d = dot([P[0] - c[0], P[1] - c[1]], n), tgt = Math.sign(d) * T / 2;
    const t = (tgt - d) / dot(u, n);
    return [P[0] + u[0] * t, P[1] + u[1] * t];
  }
  // seat outline segment whose cut ends sit flat on the other leg's faces (angled slot walls)
  const nShelfL = [-nShelf[0], nShelf[1]];
  const CXL = [-XCROSS, C];
  function cutRange(sa, sb, startCut, endCut) {
    const o = outlineRange(sa, sb), n = o.length / 2;
    const fix = (i, j, cut) => {
      const P = [o[i].x, o[i].y], Q = [o[j].x, o[j].y];
      let u = [Q[0] - P[0], Q[1] - P[1]]; const l = Math.hypot(...u); u = [u[0] / l, u[1] / l];
      const r = toStrip(P, u, cut[0], cut[1]); o[i].x = r[0]; o[i].y = r[1];
    };
    if (startCut) { fix(0, 1, startCut); fix(2 * n - 1, 2 * n - 2, startCut); }
    if (endCut) { fix(n - 1, n - 2, endCut); fix(n, n + 1, endCut); }
    return o;
  }
  const OUT_SLOTTED = [
    cutRange(0, sCrossL - SLOT_W / 2, null, [CXL, nShelfL]),
    cutRange(sCrossL + SLOT_W / 2, sCross - SLOT_W / 2, [CXL, nShelfL], [CX, nShelf]),
    cutRange(sCross + SLOT_W / 2, LEN, [CX, nShelf], null)
  ];
  const seatSlot = slotRect(CX, uSeat, nSeat);
  const voidsFront = [clip(seatSlot, nShelf, CX, T / 2, true), clip(seatSlot, nShelf, CX, T / 2, false)];
  const shelfSlot = slotRect(CX, uShelf, nShelf);
  const voidsBack = [clip(shelfSlot, nSeat, CX, T / 2, true), clip(shelfSlot, nSeat, CX, T / 2, false)];

  // solid infill at the bottom of the end pocket (right-hand end), kept below the seat bend so it sits on flat faces
  function linerPoly() {
    const yb = C + H0, top = yb + 34, sag = 8;
    const seatX = y => X1 + (SEAT_CL + H0 - y) / TAN;
    const shelfX = y => X1 + (y - SHELF_CL - H0) / TAN;
    const pts = [[XCROSS, yb]];
    const a = [shelfX(top), top], b = [seatX(top), top];
    for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push([a[0] + (b[0] - a[0]) * t, top - sag * Math.sin(Math.PI * t)]); }
    return pts;
  }

  const fmt = v => Math.round(v).toLocaleString('en-NZ');
  const overall = 2 * XEND;
  const armTop = ARM_CL + T / 2 + PAD_H;
  const shelfGap = (SEAT_CL - T / 2) - (SHELF_CL + T / 2);
  document.getElementById('spec').innerHTML = [
    ['Overall length', fmt(overall)],
    ['Depth', fmt(DEPTH)],
    ['Seat', '3 × 500'],
    ['Seat height', fmt(SEAT_CL + T / 2) + ' (' + fmt(SEAT_CL + T / 2 - SP_REC + SP_H) + ' on pad)'],
    ['Arm pad height', fmt(armTop)],
    ['Arm pad width', fmt(PAD_X1 - PAD_X0)],
    ['Shelf clear height', fmt(shelfGap)],
    ['Shelf bays', '3 × ≈ 500'],
    ['Leg angle', LEG_ANGLE + '°'],
    ['Legs cross at', CROSS_ANGLE + '°'],
    ['Halving slots', 'angled, ' + SLOT_D + ' deep'],
    ['Ply', T + ' mm, R' + (R - T / 2) + ' inside'],

  document.getElementById('caption').textContent = captions.assembled;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let view = 'assembled', anim = null;
  function setView(v) {
    view = v;
    VIEWS.forEach(k => document.getElementById('v-' + k).setAttribute('aria-pressed', String(k === v)));
    document.getElementById('caption').textContent = captions[v];
    anim = {
      t0: performance.now(), dur: reduce ? 1 : 1200,
      from: items.map(it => ({ p: it.obj.position.toArray(), r: [it.obj.rotation.x, it.obj.rotation.y, it.obj.rotation.z], s: it.obj.scale.x })),
      cam0: camera.position.toArray(), tgt0: controls.target.toArray()
    };
  }
  VIEWS.forEach(k => document.getElementById('v-' + k).addEventListener('click', () => setView(k)));
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
    if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  }
  function frame(now) {
    resize();
    if (anim) {
      const t = Math.min(1, (now - anim.t0) / anim.dur), e = ease(t);
      items.forEach((it, i) => {
        const a = anim.from[i], b = it.states[view];
        it.obj.position.set(lerp(a.p[0], b.p[0], e), lerp(a.p[1], b.p[1], e), lerp(a.p[2], b.p[2], e));
        it.obj.rotation.set(lerp(a.r[0], b.r[0], e), lerp(a.r[1], b.r[1], e), lerp(a.r[2], b.r[2], e));
        it.obj.scale.setScalar(Math.max(lerp(a.s, b.s, e), 1e-4));
        it.obj.visible = it.obj.scale.x > 0.001;
      });
      const cp = CAM[view].pos, ct = CAM[view].tgt;
      camera.position.set(lerp(anim.cam0[0], cp[0], e), lerp(anim.cam0[1], cp[1], e), lerp(anim.cam0[2], cp[2], e));
      controls.target.set(lerp(anim.tgt0[0], ct[0], e), lerp(anim.tgt0[1], ct[1], e), lerp(anim.tgt0[2], ct[2], e));
      if (t >= 1) {
        items.forEach(it => {
          it.obj.rotation.x = ((it.obj.rotation.x % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
          VIEWS.forEach(k => { const r = it.states[k].r; if (Math.abs(r[0] - 2 * Math.PI) < 1e-6) r[0] = 0; });
        });
        anim = null;
      }
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
